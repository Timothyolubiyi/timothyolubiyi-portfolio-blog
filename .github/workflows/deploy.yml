name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.6.6"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_use_route53: ${{ secrets.USE_ROUTE53 }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          TF_VAR_web_acl_id: ${{ secrets.WEB_ACL_ARN }}

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -recursive -check
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_use_route53: ${{ secrets.USE_ROUTE53 }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          TF_VAR_web_acl_id: ${{ secrets.WEB_ACL_ARN }}


      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_use_route53: ${{ secrets.USE_ROUTE53 }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          TF_VAR_web_acl_id: ${{ secrets.WEB_ACL_ARN }}

  build:
    name: Build React Application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy Infrastructure & Website
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_use_route53: ${{ secrets.USE_ROUTE53 }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          TF_VAR_web_acl_id: ${{ secrets.WEB_ACL_ARN }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_use_route53: ${{ secrets.USE_ROUTE53 }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          TF_VAR_web_acl_id: ${{ secrets.WEB_ACL_ARN }}
      - name: Upload Static Assets
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000"

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "public,max-age=300" \
            --content-type "text/html"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Verify Deployment
        run: |
          echo "========================================"
          echo "Deployment Successful!"
          echo "========================================"
          echo "Bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "Website: https://timothyolubiyi.name.ng"

  notify:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
      - deploy

    if: always()

    steps:
      - name: Show Pipeline Status
        run: |
          echo "Terraform Validation : ${{ needs.validate.result }}"
          echo "Application Build    : ${{ needs.build.result }}"
          echo "Deployment           : ${{ needs.deploy.result }}"

          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo ""
            echo "Portfolio deployed successfully."
          else
            echo ""
            echo "Deployment failed."
            exit 1
          fi